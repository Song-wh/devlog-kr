name: cpu-bench

on:
  push:
    paths: ["cpu-bench/**", ".github/workflows/cpu-bench.yml"]
  pull_request:
    paths: ["cpu-bench/**", ".github/workflows/cpu-bench.yml"]

jobs:
  build-test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc, clang-cl]
    defaults:
      run:
        working-directory: cpu-bench
    steps:
      - uses: actions/checkout@v4
      - name: Python reference digest
        run: |
          python tools/int_reference.py 1
          python tools/mem_reference.py read 1 1048576
          python tools/mem_reference.py latency 1 1048576
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test (correctness + short smoke run)
        run: ctest --preset ${{ matrix.preset }}
      - name: Runner output
        run: |
          build/${{ matrix.preset }}/bin/cpu-bench-runner.exe info
          build/${{ matrix.preset }}/bin/cpu-bench-runner.exe run int --duration-ms 500 --runs 3
          build/${{ matrix.preset }}/bin/cpu-bench-runner.exe run mem --workload read --mt --size 128M --duration-ms 500 --runs 3
          build/${{ matrix.preset }}/bin/cpu-bench-runner.exe sweep mem --workload latency --from 16K --to 64M --duration-ms 200 --runs 2
